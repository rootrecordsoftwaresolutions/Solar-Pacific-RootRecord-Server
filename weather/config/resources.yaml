# Every resource from NWS_Hawaii_Resource_Map.md, tagged with category
# (→ which fetch/ module owns it), tier (→ config/tiers.yaml), and a
# local_path_template following nws_plan.md Section 1's rule:
#
#   https://<host>/<path>/<name>.<ext>
#   -> <base_dir>/<host>/<path>/<name>/<name>_current.<ext>          (live)
#   -> <base_dir>/<host>/<path>/<name>/archive/<MM-DD-YYYY>/<name>_<TIMESTAMP>.<ext>  (history)
#
# base_dir = /home/rootrecord/Database/WEATHER/Hawai'i/hfo
# path_resolver.py derives local_path_template mechanically from `url` at
# runtime for any resource that follows the general rule — the templates
# below are recorded for the handful of URLs where the name/extension
# isn't obvious from the URL alone (query strings, extensionless paths).
#
# method: api (structured JSON, primary) | scrape (product.php HTML, fallback
#         or only option) | image (static gif/png/jpg/tif) | json (non-product
#         structured API, e.g. alerts/points/CurrentStorms)

# ---------------------------------------------------------------------------
# 1. TEXT PRODUCTS — fetch/text_products.py (primary) / text_products_fallback.py
# ---------------------------------------------------------------------------
text_products:
  - id: sfp_state_forecast
    awips_id: SFPHFO
    name: "State Forecast for Hawaii"
    tier: 1
    method: api
    url: "https://api.weather.gov/products/types/SFP/locations/HFO"
    fallback_url: "https://www.weather.gov/hfo/SFP"
    clean_text: true

  - id: sft_tabular_forecast
    awips_id: SFTHFO
    name: "Tabular State Forecast"
    tier: 4
    method: scrape
    url: "https://forecast.weather.gov/product.php?site=HFO&product=SFT&issuedby=HFO"
    clean_text: true

  - id: zfp_zone_forecast
    awips_id: ZFPHFO
    name: "7-Day Zone Forecasts (all islands)"
    tier: 4
    method: api
    url: "https://api.weather.gov/products/types/ZFP/locations/HFO"
    fallback_url: "https://www.weather.gov/hfo/ZFP"
    clean_text: true

  - id: afd_area_forecast_discussion
    awips_id: AFDHFO
    name: "Area Forecast Discussion"
    tier: 1
    method: api
    url: "https://api.weather.gov/products/types/AFD/locations/HFO"
    fallback_url: "https://www.weather.gov/hfo/AFD"
    clean_text: true

  - id: pfm_point_forecast_matrix
    awips_id: PFMHFO
    name: "Point Forecast Matrix"
    tier: 4
    method: scrape
    url: "https://forecast.weather.gov/product.php?site=HFO&product=PFM&issuedby=HFO"
    clean_text: true

  - id: nowhfo_short_term_forecast
    awips_id: NOWHFO
    name: "Short Term Forecast (nowcast)"
    tier: 1
    method: api
    url: "https://api.weather.gov/products/types/NOW/locations/HFO"
    fallback_url: "https://www.weather.gov/hfo/NOWHI"
    clean_text: true

  - id: fwf_fire_weather_forecast
    awips_id: FWFHFO
    name: "Fire Weather Forecast"
    tier: 4
    method: scrape
    url: "https://forecast.weather.gov/product.php?site=HFO&product=FWF&issuedby=HFO"
    clean_text: true

  - id: hwo_hazardous_weather_outlook
    awips_id: HWOHFO
    name: "Hazardous Weather Outlook"
    tier: 1
    method: api
    url: "https://api.weather.gov/products/types/HWO/locations/HFO"
    fallback_url: "https://www.weather.gov/hfo/watchwarn"
    clean_text: true

  - id: pns_public_information_statement
    awips_id: PNSHFO
    name: "Public Information Statement"
    tier: 4
    method: scrape
    url: "https://www.weather.gov/hfo/pns"
    rss_url: "/source/hfo/xml/PNSHFO.xml"
    clean_text: true

  - id: lsr_local_storm_reports
    awips_id: LSRHFO
    name: "Local Storm Reports"
    tier: 1
    method: scrape
    url: "https://www.weather.gov/hfo/lsr"
    rss_url: "/source/hfo/xml/LSRHFO.xml"
    clean_text: true

  - id: rer_record_event_reports
    awips_id: RERHFO
    name: "Record Event Reports"
    tier: 5
    method: scrape
    url: "https://www.weather.gov/hfo/rer"
    rss_url: "/source/hfo/xml/RERHFO.xml"
    clean_text: true

# Watches/Warnings/Advisories — all funnel through the alerts API (Tier 0)
# rather than being polled individually; AWIPS IDs listed for reference/
# cross-check against alerts JSON `parameters.AWIPSidentifier`, not as
# separate fetch targets.
watch_warning_awips_ids_reference_only:
  - FFAHFO   # Flood Watch
  - FLSHFO   # Flood Statement
  - FFWHFO   # Flash Flood Warning
  - FFSHFO   # Flash Flood Statement
  - CFWHFO   # High Surf Advisory/Warning
  - SPSHFO   # Special Weather Statement
  - WCNHFO   # Tornado/Severe T-storm Watch
  - SVRHFO   # Severe Thunderstorm Warning
  - TORHFO   # Tornado Warning
  - SVSHFO   # Severe Weather Statement
  - SMWHFO   # Special Marine Warning
  - MWSHFO   # Marine Weather Statement
  - NPWHFO   # Non-Precipitation Warnings
  - WSWHFO   # Winter Storm Watch/Warning/Advisory (summits)
  - RFWHFO   # Fire Weather Red Flag Warning
  - ESFHFO   # Hydrologic Outlook

# ---------------------------------------------------------------------------
# 2. ALERTS — fetch/alerts.py (Tier 0, the one true minute-level resource)
# ---------------------------------------------------------------------------
alerts:
  - id: alerts_active_hi
    name: "Active alerts, statewide"
    tier: 0
    method: json
    url: "https://api.weather.gov/alerts/active?area=HI"
    local_path_template: "hfo/api.weather.gov/alerts/active/area=HI/area=HI_current.json"
    clean_text: false  # cleaned selectively per-field by core/text_cleaner.py, not whole-file
    note: "Do not scrape /hfo/watchwarn — it's client-rendered JS and returns an empty shell on plain fetch."

  - id: wwamap_png
    name: "Statewide watch/warning map (PNG)"
    tier: 2
    method: image
    url: "https://www.weather.gov/wwamap/png/hfo.png"

# ---------------------------------------------------------------------------
# 3. HURRICANES / CPHC — owned by hurricanes/scripts/, NOT fetch/.
#    Listed here for completeness of the full resource inventory only.
# ---------------------------------------------------------------------------
hurricanes_reference_only:
  - id: tcm_forecast_advisory
    awips_id_pattern: "TCMCP1-5"
    name: "Tropical Cyclone Forecast/Advisory"
    method: api
    url: "https://api.weather.gov/products/types/TCM/locations/HFO"

  - id: tcp_public_advisory
    awips_id_pattern: "TCPCP1-5"
    name: "Tropical Cyclone Public Advisory"
    method: api
    url: "https://api.weather.gov/products/types/TCP/locations/HFO"

  - id: tcd_discussion
    awips_id_pattern: "TCDCP1-5"
    name: "Tropical Cyclone Discussion"
    method: api
    url: "https://api.weather.gov/products/types/TCD/locations/HFO"

  - id: tcu_position_update
    awips_id_pattern: "TCUCP1-5"
    name: "Tropical Cyclone Position Update"
    method: api
    url: "https://api.weather.gov/products/types/TCU/locations/HFO"

  - id: hls_local_statement
    awips_id: HLSHFO
    name: "Tropical Cyclone Local Statement (impacts/evacuations)"
    method: api
    url: "https://api.weather.gov/products/types/HLS/locations/HFO"

  - id: gtwo_tropical_weather_outlook
    name: "Tropical Weather Outlook"
    method: scrape
    url: "https://www.nhc.noaa.gov/gtwo.php?basin=cpac&fdays=5"

  - id: hfotwscp_monthly_summary
    name: "Monthly Tropical Weather Summary"
    method: scrape
    url: "https://www.nhc.noaa.gov/text/HFOTWSCP.shtml"

  - id: tcsnp_central_npac_summary
    name: "Central N. Pacific Tropical Cyclone Summary (satellite fix)"
    method: scrape
    url: "https://www.weather.gov/hfo/TCSNP"

  - id: tcssp_south_pacific_summary
    name: "South Pacific Tropical Cyclone Summary"
    method: scrape
    url: "https://www.weather.gov/hfo/TCSSP"

  - id: cphc_landing_page
    name: "CPHC landing page (all active storms)"
    method: scrape
    url: "https://www.weather.gov/cphc/"

  - id: nhc_current_storms
    name: "NHC Current Storms (all basins, structured)"
    method: json
    url: "https://www.nhc.noaa.gov/CurrentStorms.json"
    note: "Primary trigger for 'is anything CPHC-relevant active right now' — cleaner than parsing prose."

# ---------------------------------------------------------------------------
# 4. SATELLITE — fetch/satellite.py
# ---------------------------------------------------------------------------
satellite:
  items:
  - id: hawaii_ir_latest
    name: "State of Hawaii — Infrared (latest frame)"
    tier: 2
    method: image
    url: "https://www.weather.gov/images/hfo/satellite/Hawaii_IR.gif"

  - id: hawaii_ir_loop
    name: "State of Hawaii — Infrared (loop)"
    tier: 2
    method: image
    url: "https://www.weather.gov/images/hfo/satellite/Hawaii_IR_loop.gif"

  - id: goes18_hi_geocolor
    name: "GOES-18 Hawaii sector, GeoColor (full-res, NESDIS)"
    tier: 2
    method: image
    url: "https://cdn.star.nesdis.noaa.gov/GOES18/ABI/SECTOR/hi/GEOCOLOR/GOES18-HI-GEOCOLOR-1000x1000.gif"
    note: "Higher resolution than HFO's own gifs. NESDIS-hosted, not NWS proper, but public."

  # Individual loop frames (00-10) — one resource id per sector, frame index
  # is a path segment (not a separate resource entry per frame; fetch/satellite.py
  # iterates 00-10 for each of the 5 sector keys below at runtime).
  loop_frame_sectors:
    frame_range: [0, 10]
    tier: 2
    sectors:
      - key: IRHawaii
        base_url: "https://www.weather.gov/images/hfo/loops/IRHawaii/"