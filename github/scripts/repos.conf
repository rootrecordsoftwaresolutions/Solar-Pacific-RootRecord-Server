# ==============================================================================
# repos.conf — RootRecord GitHub auto-sync catalog (tab-separated)
# ------------------------------------------------------------------------------
# HOW TO ADD A REPO
#   1) Copy the TEMPLATE line at the bottom of SECTION: REPOS.
#   2) Fill id, enabled (1/0), mode, local_path, github_slug, remote_name.
#   3) mode=inplace — local_path is the git work tree.
#      mode=mirror — rsync local_path → Database/GITHUB/worktrees/<id> then push.
#   4) Keep tabs between fields (not spaces).
#
# Columns: id  enabled  mode  local_path  github_slug  remote_name
# Layout style (standing): keep SECTION banners + TEMPLATE. Never strip.
# ==============================================================================

